<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ui-zoom system harness</title>
<style>html,body{margin:0;padding:0}#probe{width:200px;height:200px;background:#123}</style>
</head>
<body>
<div id="probe"></div>
<pre id="out"></pre>
<script>
// --- the facade the shell installs in <head> (packages/client/modules bootInjections)
const registrations = [];
window.__ModuleLoader__ = {
  mode: 'queue',
  pendingQueue: registrations,
  load(registration) { registrations.push(registration); },
};
</script>
<script>
/*__BUNDLE__*/
</script>
<script>
(async () => {
  const lines = [];
  const rec = (key, value) => lines.push(key + ' = ' + String(value));
  const report = () => {
    document.getElementById('out').textContent = lines.join('\n');
    document.title = 'DONE';
  };

  try {
    rec('registrations', registrations.length);
    const registration = registrations[0];
    if (registration === undefined) { rec('fatal', 'no registration'); report(); return; }
    rec('id', registration.id);
    rec('factoryType', typeof registration.factory);

    const requested = [];
    let plugin;
    try {
      plugin = registration.factory((specifier) => {
        requested.push(specifier);
        throw new Error('unexpected external: ' + specifier);
      });
    } catch (error) {
      rec('factoryThrew', error && error.message ? error.message : error);
      report();
      return;
    }
    rec('externalRequests', requested.length === 0 ? '(none)' : requested.join(','));
    rec('pluginType', plugin === null ? 'null' : typeof plugin);
    rec('hasApply', plugin && typeof plugin.apply === 'function');
    rec('inject', JSON.stringify(plugin && plugin.inject));

    // --- a plugin context with the two injected services
    const store = new Map();
    const registered = [];
    const effects = [];
    const ctx = {
      shortcuts: { register(command) { registered.push(command.id); return () => {}; } },
      locale: {
        register() { return () => {}; },
        bind() { return (key) => key; },
      },
      effect(callback, label) { effects.push(label); const d = callback(); if (typeof d === 'function') effects.push('dispose:' + label); },
      get() { return undefined; },
    };
    Object.defineProperty(window, 'localStorage', {
      configurable: true,
      value: {
        getItem: (key) => (store.has(key) ? store.get(key) : null),
        setItem: (key, value) => { store.set(key, String(value)); },
        removeItem: (key) => { store.delete(key); },
      },
    });

    try {
      plugin.apply(ctx);
    } catch (error) {
      rec('applyThrew', error && error.message ? error.message : error);
      report();
      return;
    }
    rec('registeredCommands', registered.join(','));
    rec('effects', effects.length);

    const key = (code, mods) => window.dispatchEvent(new KeyboardEvent('keydown', Object.assign({ code, bubbles: true, cancelable: true }, mods || {})));
    const scale = () => document.documentElement.style.getPropertyValue('zoom');
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const probe = document.getElementById('probe');
    rec('renderedAtRest', Math.round(probe.getBoundingClientRect().width));

    key('Equal', { ctrlKey: true });
    rec('afterCtrlEqual', scale());
    rec('renderedAt110', Math.round(probe.getBoundingClientRect().width));
    await wait(120);
    key('Equal', { ctrlKey: true });
    rec('afterTwice', scale());
    await wait(120);
    key('Equal', { ctrlKey: true, shiftKey: true });
    rec('afterShiftEqual', scale());
    await wait(120);
    key('NumpadAdd', { ctrlKey: true });
    rec('afterNumpadAdd', scale());
    await wait(120);
    key('Minus', { ctrlKey: true });
    rec('afterCtrlMinus', scale());
    await wait(120);
    key('NumpadSubtract', { ctrlKey: true });
    rec('afterNumpadSubtract', scale());
    await wait(120);
    key('Digit0', { ctrlKey: true });
    rec('afterCtrlZero', scale() || '(none)');
    rec('renderedAfterReset', Math.round(probe.getBoundingClientRect().width));

    // A press without the primary modifier must be ignored.
    await wait(120);
    key('Equal', {});
    rec('afterBareEqual', scale() || '(none)');
    await wait(120);
    // An unrelated modified command must be ignored.
    key('KeyA', { ctrlKey: true });
    rec('afterCtrlA', scale() || '(none)');
    await wait(120);
    // Alt combinations belong to the shell.
    key('Minus', { ctrlKey: true, altKey: true });
    rec('afterCtrlAltMinus', scale() || '(none)');

    // Persistence: the accepted scale is stored under the documented key.
    await wait(120);
    key('Equal', { ctrlKey: true });
    rec('storedValue', store.get('dsh.ui-zoom.scale'));
    rec('overflowLock', document.querySelectorAll('style').length > 0);

    // Clamping at the ceiling.
    for (let index = 0; index < 12; index++) { await wait(90); key('Equal', { ctrlKey: true }); }
    rec('clampedTop', scale());
    for (let index = 0; index < 16; index++) { await wait(90); key('Minus', { ctrlKey: true }); }
    rec('clampedBottom', scale());

    report();
  } catch (error) {
    rec('driverThrew', error && error.stack ? error.stack : error);
    report();
  }
})();
</script>
</body>
</html>
